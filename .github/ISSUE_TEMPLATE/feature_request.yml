name: Feature request
description: An idea for something Gantry could do
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Gantry to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
