name: CI
on:
  push:
  pull_request:
  # macOS and Windows run only from here (Actions → CI → Run workflow): their minutes cost 10× and 2×.
  workflow_dispatch:
    inputs:
      linux:
        description: Also run Linux (fmt, deny, tests)
        type: boolean
        default: true

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Line numbers in backtraces but no full debug info: linking the GPUI test binaries is most of the build time.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["ubuntu-24.04"]') || inputs.linux && fromJSON('["ubuntu-24.04", "macos-15", "windows-2025"]') || fromJSON('["macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    # A cold build (no cache) takes about 30 min on Linux; a hang must not run for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libzstd-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the built dependencies even when clippy or a test fails (first macOS/Windows runs).
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every crate's failures in one run, not just the first crate's.
      - run: cargo test --workspace --no-fail-fast

  deny:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources advisories
