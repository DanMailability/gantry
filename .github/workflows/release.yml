name: Release
# Manual only (Actions → Release → Run workflow): a macOS runner minute costs 10×.
on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-release
      - name: Build Gantry.app and the .dmg
        run: sh packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-macos
          path: dist/*.dmg
